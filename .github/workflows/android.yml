name: Android signed release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Restore signing keystore
        shell: python
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          import base64
          import binascii
          import os
          from pathlib import Path

          required = (
              "ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          try:
              data = base64.b64decode(
                  "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True,
              )
          except (ValueError, binascii.Error):
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid Base64") from None
          if not data:
              raise SystemExit("The signing keystore is empty")
          target = Path(os.environ["RUNNER_TEMP"]) / "kampus-release.p12"
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(data)

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify keystore and alias
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: >-
          keytool -list -storetype PKCS12
          -keystore "${RUNNER_TEMP}/kampus-release.p12"
          -alias "${ANDROID_KEY_ALIAS}"
          -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null

      - name: Install required Android SDK packages
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-35"
          "build-tools;35.0.0"

      - name: Set up pinned Gradle without a wrapper
        uses: gradle/actions/setup-gradle@v4.4.3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Run unit tests, lint, and assemble signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kampus-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          gradle --no-daemon --no-configuration-cache
          testReleaseUnitTest lintRelease assembleRelease

      - name: Verify APK signature and create checksum
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app-release.apk
          sha256sum app-release.apk > app-release.apk.sha256
        working-directory: app/build/outputs/apk/release

      - name: Remove temporary signing keystore
        if: ${{ always() }}
        run: rm -f -- "${RUNNER_TEMP}/kampus-release.p12"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kampus-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kampus-test-lint-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn
          retention-days: 14
